name: Compilar APK

on:
  workflow_dispatch:        # botón «Run workflow» en la pestaña Actions
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Permisos de cámara
        run: python3 scripts/patch_manifest.py

      - name: Copiar la app al proyecto
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: conteo-etiquetas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
